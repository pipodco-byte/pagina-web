name: Sync Google Reviews

on:
  schedule:
    # Ejecutar cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm run build

      - name: Sync Google Reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');
          const path = require('path');
          
          const apiKey = process.env.GOOGLE_PLACES_API_KEY;
          const placeId = process.env.GOOGLE_PLACE_ID;
          
          if (!apiKey || !placeId) {
            console.error('Missing Google Places credentials');
            process.exit(1);
          }
          
          const url = `https://maps.googleapis.com/maps/api/place/details/json?place_id=${placeId}&fields=rating,user_ratings_total&key=${apiKey}`;
          
          https.get(url, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              try {
                const response = JSON.parse(data);
                
                if (response.status !== 'OK') {
                  console.error('Google API error:', response);
                  process.exit(1);
                }
                
                const { rating, user_ratings_total } = response.result;
                
                const reviewsData = {
                  rating: rating ? parseFloat(rating).toFixed(1) : '5.0',
                  totalReviews: user_ratings_total || 0,
                  lastUpdated: new Date().toISOString(),
                  comments: [
                    'Datos sincronizados desde Google Places API',
                    'Archivos que usan este dato:',
                    '- src/components/promo/pipodGoogleReviews.jsx',
                    '- src/components/SEO/LocalBusinessSchema.astro',
                    '- src/components/SEO/RetomaPageSchema.astro',
                    '- src/components/SEO/ServicePageSchema.astro',
                    '- src/components/SEO/ContactPageSchema.astro'
                  ]
                };
                
                const reviewsPath = path.join(process.cwd(), 'public', 'data', 'reviews.json');
                fs.writeFileSync(reviewsPath, JSON.stringify(reviewsData, null, 2));
                console.log('Reviews updated:', reviewsData);
              } catch (error) {
                console.error('Error parsing response:', error);
                process.exit(1);
              }
            });
          }).on('error', (error) => {
            console.error('API request error:', error);
            process.exit(1);
          });
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/reviews.json
          git commit -m "chore: sync Google reviews" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
