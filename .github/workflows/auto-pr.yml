name: Auto PR from develop to main

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    # Permite trigger manual: gh workflow run auto-pr.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch main branch
        run: |
          git fetch origin main
          git log --oneline -3

      - name: Get commit count since main
        id: commits
        run: |
          # Count commits between main and develop
          COUNT=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo "0")
          echo "Commits to merge: $COUNT"
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Get commit list
        id: commits-list
        run: |
          git log origin/main..HEAD --oneline | head -20 > commits.txt
          cat commits.txt

      - name: Create PR
        id: pr
        run: |
          # Check if PR already exists
          PR_EXISTS=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$PR_EXISTS" ]; then
            echo "ℹ️ PR already exists: #$PR_EXISTS"
            echo "pr_number=$PR_EXISTS" >> $GITHUB_OUTPUT

            # Update PR with new commits
            gh pr update $PR_EXISTS --body "## 🚀 Release PR — develop → main

**Commits being merged:** ${{ steps.commits.outputs.count }}

### Resumen
Nuevos cambios listos para producción.

### Commits
\`\`\`
$(cat commits.txt)
\`\`\`

### Checklist
- [ ] Build passes
- [ ] Tests pass
- [ ] Preview OK
- [ ] Listo para producción ✅

---
_Updated $(date '+%Y-%m-%d %H:%M') by GitHub Actions_"

          else
            # Create new PR
            TITLE="Merge develop → main (${{ steps.commits.outputs.count }} commits)"
            BODY="## 🚀 Release PR — develop → main

**Commits being merged:** ${{ steps.commits.outputs.count }}

### Resumen
Automated PR ready for production deployment.

### Commits
\`\`\`
$(cat commits.txt)
\`\`\`

### Checklist
- [ ] Build passes
- [ ] Tests pass
- [ ] Preview OK
- [ ] Listo para producción ✅

---
_Created $(date '+%Y-%m-%d %H:%M') by GitHub Actions_"

            gh pr create --title "$TITLE" --body "$BODY" --base main --head develop

            PR_NUMBER=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "✅ PR #$PR_NUMBER created"
          fi

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: steps.pr.outputs.pr_number
        run: |
          if [ -n "${{ steps.pr.outputs.pr_number }}" ]; then
            gh pr comment ${{ steps.pr.outputs.pr_number }} --body "## ✅ Listo para review

Haz click en **Merge** cuando estés listo para desplegar a producción.

O usa:
- \`gh pr merge ${{ steps.pr.outputs.pr_number }}\` — squash merge
- \`gh pr close ${{ steps.pr.outputs.pr_number }}\` — cancelar"
          fi

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}